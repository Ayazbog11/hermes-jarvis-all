name: release
# Создаёт GitHub Release при изменении файла VERSION в main.
# Канал автообновления `stable` берёт именно релизы; `main` — каждый коммит.
# Артефакты: jarvis-hermes-X.Y.Z.zip (исходники + собранное JARVIS.app внутри app/prebuilt/) и JARVIS.app.zip отдельно.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  app:
    # JARVIS.app собирается на macOS-раннере, чтобы пользователю без Xcode CLT не пришлось ничего компилировать
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash app/build.sh "$RUNNER_TEMP/JARVIS.app" && test -x "$RUNNER_TEMP/JARVIS.app/Contents/MacOS/JARVIS"
      - run: cd "$RUNNER_TEMP" && ditto -c -k --keepParent JARVIS.app JARVIS.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS.app
          path: ${{ runner.temp }}/JARVIS.app.zip
  release:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Skip if release already published
        id: t
        # ВАЖНО: проверяем существование именно GitHub Release через API, а НЕ `git rev-parse
        # v${version}` через локальный git-тег. Раньше здесь была проверка git-тега — но тег
        # обычно создаётся и пушится вручную (`git tag vX.Y.Z && git push --tags`) в ТОМ ЖЕ
        # действии, что и пуш файла VERSION, который и запускает этот workflow. Из-за
        # `fetch-depth: 0` checkout выше подтягивает уже запушенный тег, `git rev-parse`
        # находит его немедленно и шаг решает, что релиз "уже есть" — хотя объект Release на
        # GitHub при этом никогда не создавался. Итог: тег есть, CI зелёный, а
        # `releases/latest` не продвигается — ровно это наблюдалось для v2.1.1..v2.1.5
        # (git-теги существуют, но GitHub Releases застряли на v2.1.0). Проверка через API
        # релизов (а не тегов) не подвержена этой гонке.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.t.outputs.exists != 'true'
        with: { python-version: "3.12" }
      - run: pip install pytest pyyaml telethon && python -m pytest tests -q
        if: steps.t.outputs.exists != 'true'
      - uses: actions/download-artifact@v4
        if: steps.t.outputs.exists != 'true'
        with: { name: JARVIS.app, path: app/prebuilt }
      - name: Release notes from CHANGELOG
        if: steps.t.outputs.exists != 'true'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## "v { on=1; next } on && /^## / { exit } on { print }' docs/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Версия ${{ steps.v.outputs.version }}" > notes.md
          printf '\n---\nУстановка одной командой:\n\n    curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/get.sh | bash\n' >> notes.md
      - name: Zip
        if: steps.t.outputs.exists != 'true'
        run: |
          zip -qr "jarvis-hermes-${{ steps.v.outputs.version }}.zip" . -x ".git/*" "*/__pycache__/*" ".pytest_cache/*" "notes.md"
          cp app/prebuilt/JARVIS.app.zip JARVIS.app.zip
      - uses: softprops/action-gh-release@v3
        if: steps.t.outputs.exists != 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: JARVIS ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            jarvis-hermes-${{ steps.v.outputs.version }}.zip
            JARVIS.app.zip
