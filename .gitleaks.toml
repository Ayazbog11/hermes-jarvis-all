# Конфигурация gitleaks (.github/workflows/security.yml) — расширяет встроенные правила
# только списком допустимых ложных срабатываний. Реальные секреты никогда не должны
# попадать в репозиторий; всё, что здесь разрешено, — заведомо фиктивные значения:
# примеры в документации, тестовые фикстуры с намеренно поддельными токенами (тесты
# редактора базы знаний/vault проверяют именно то, что такие строки маскируются перед
# записью, см. plugins/jarvis-brain/db.py).

title = "gitleaks config — JARVIS"

[extend]
useDefault = true

[[allowlists]]
description = "Плейсхолдеры в документации и фиктивные токены в тестах"
paths = [
    '''docs/.*\.md''',
    '''tests/test_brain\.py''',
    '''tests/test_vault\.py''',
]
regexes = [
    '''sk-or-\.\.\.''',                                    # плейсхолдер в docs/INSTALL*.md
    '''ghp_abcdefghijklmnopqrstuvwxyz0123456789''',         # фикстура теста маскирования
    '''sk-secretsecretsecretsecret1234567890''',            # фикстура теста маскирования
]
